<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bedrock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E73FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B9BFF"/>
      <stop offset="1" stop-color="#2B8CFF"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FD6C3"/>
      <stop offset="1" stop-color="#30C7B5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6B6480"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7C5CFF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="620" fill="#FFF7EF"/>

  <text x="40" y="54" font-size="30" font-weight="800" fill="#7C5CFF">StudySnap — AWS Architecture</text>
  <text x="40" y="86" font-size="17" fill="#6B6480">Amazon Bedrock at the core · fully serverless</text>

  <line x1="268" y1="300" x2="330" y2="300" stroke="#6B6480" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="300" x2="622" y2="300" stroke="#6B6480" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="872" y1="300" x2="934" y2="300" stroke="#6B6480" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="235" width="228" height="130" rx="18" fill="url(#purple)"/>
  </g>
  <text x="154" y="285" font-size="40" text-anchor="middle">🖥️</text>
  <text x="154" y="322" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Browser</text>
  <text x="154" y="348" font-size="13" fill="#ECE7FF" text-anchor="middle">Static site on Amazon S3</text>

  <g filter="url(#shadow)">
    <rect x="332" y="235" width="228" height="130" rx="18" fill="url(#blue)"/>
  </g>
  <text x="446" y="285" font-size="40" text-anchor="middle">🚪</text>
  <text x="446" y="322" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">API Gateway</text>
  <text x="446" y="348" font-size="13" fill="#E3F0FF" text-anchor="middle">routing + API key</text>

  <g filter="url(#shadow)">
    <rect x="624" y="235" width="248" height="130" rx="18" fill="url(#teal)"/>
  </g>
  <text x="748" y="285" font-size="40" text-anchor="middle">⚙️</text>
  <text x="748" y="322" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">7 Lambda functions</text>
  <text x="748" y="348" font-size="13" fill="#E4FFFB" text-anchor="middle">Python · one per widget</text>

  <g filter="url(#shadow)">
    <rect x="936" y="215" width="304" height="170" rx="20" fill="url(#bedrock)" stroke="#E8850E" stroke-width="2"/>
  </g>
  <text x="1088" y="268" font-size="44" text-anchor="middle">🧠</text>
  <text x="1088" y="308" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">Amazon Bedrock</text>
  <text x="1088" y="334" font-size="15" font-weight="700" fill="#FFF3E0" text-anchor="middle">Claude Haiku 4.5</text>
  <text x="1088" y="360" font-size="13" fill="#FFF3E0" text-anchor="middle">reads notes · generates every output</text>

  <rect x="1150" y="200" width="78" height="30" rx="15" fill="#2B2240"/>
  <text x="1189" y="220" font-size="14" font-weight="800" fill="#FF9F1C" text-anchor="middle">CORE</text>

  <g>
    <line x1="154" y1="365" x2="154" y2="430" stroke="#B9AEDd" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="40" y="430" width="228" height="64" rx="14" fill="#ffffff" stroke="#F0E6F5" stroke-width="1.5"/>
    <text x="154" y="460" font-size="26" text-anchor="middle">🪣</text>
    <text x="154" y="483" font-size="13" fill="#6B6480" text-anchor="middle">Amazon S3 · static hosting</text>
  </g>

  <text x="300" y="290" font-size="12" fill="#6B6480" text-anchor="middle">POST</text>
  <text x="591" y="290" font-size="12" fill="#6B6480" text-anchor="middle">invoke</text>
  <text x="903" y="290" font-size="12" fill="#6B6480" text-anchor="middle">model</text>

  <path d="M936,360 C700,470 420,470 160,392" fill="none" stroke="#FF6FB5" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="560" y="462" font-size="13" fill="#FF6FB5" text-anchor="middle" font-weight="700">streamed study pack → rendered on screen</text>

  <text x="40" y="585" font-size="13" fill="#6B6480">Browser → API Gateway → 7 Lambda functions → Amazon Bedrock · S3 hosts the website</text>
</svg>
