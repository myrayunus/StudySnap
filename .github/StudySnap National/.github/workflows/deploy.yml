name: Deploy StudySnap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template infra/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name study-snap \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Inject endpoint URLs into frontend
        run: |
          get_output() {
            aws cloudformation describe-stacks --stack-name study-snap \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }

          # Inject the API Gateway base URL; the frontend builds each endpoint from it.
          API_BASE=$(get_output ApiBaseUrl)
          echo "Injecting API base URL: $API_BASE"
          sed -i "s|API_BASE_URL|$API_BASE|g" frontend/index.html

      - name: Sync frontend to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name study-snap \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          aws s3 sync frontend/ "s3://$BUCKET" --cache-control no-cache --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudformation describe-stacks --stack-name study-snap \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          echo "Invalidating CloudFront distribution $DIST_ID"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Print website URLs
        run: |
          echo "S3 website (HTTP):"
          aws cloudformation describe-stacks --stack-name study-snap \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text
          echo "CloudFront (HTTPS) - use this:"
          aws cloudformation describe-stacks --stack-name study-snap \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" --output text
