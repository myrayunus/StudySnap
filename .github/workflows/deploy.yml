name: Deploy StudySnap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: sam build --template infra/template.yaml

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name study-snap \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Inject endpoint URLs into frontend
        run: |
          get_output() {
            aws cloudformation describe-stacks --stack-name study-snap \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }

          URL=$(get_output EstimatedStudyTimeUrl)
          sed -i "s|URL_ESTIMATED_STUDY_TIME|$URL|g" frontend/index.html

          URL=$(get_output BulletPointSummaryUrl)
          sed -i "s|URL_BULLET_POINT_SUMMARY|$URL|g" frontend/index.html

          URL=$(get_output KeyTermsGlossaryUrl)
          sed -i "s|URL_KEY_TERMS_GLOSSARY|$URL|g" frontend/index.html

          URL=$(get_output RealWorldExamplesUrl)
          sed -i "s|URL_REAL_WORLD_EXAMPLES|$URL|g" frontend/index.html

          URL=$(get_output DifficultyLevelTagUrl)
          sed -i "s|URL_DIFFICULTY_LEVEL_TAG|$URL|g" frontend/index.html

          URL=$(get_output FlashcardsUrl)
          sed -i "s|URL_FLASHCARDS|$URL|g" frontend/index.html

          URL=$(get_output InteractiveQuizUrl)
          sed -i "s|URL_INTERACTIVE_QUIZ|$URL|g" frontend/index.html

      - name: Sync frontend to S3
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name study-snap \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          aws s3 sync frontend/ "s3://$BUCKET" --cache-control no-cache --delete

      - name: Print website URL
        run: |
          aws cloudformation describe-stacks --stack-name study-snap \
            --query "Stacks[0].Outputs[?OutputKey=='WebsiteUrl'].OutputValue" --output text
