AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StudySnap - AI study assistant (7 text Lambdas + 1 image Lambda behind API Gateway, S3 site)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Handler: app.handler

Resources:

  # ---------------------------------------------------------------------------
  # IAM role shared by all functions
  # ---------------------------------------------------------------------------
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: StudySnapAppBedrockRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:ap-southeast-5:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:ap-southeast-5::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:*:*:inference-profile/*anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-canvas-v1:0

  # ---------------------------------------------------------------------------
  # Single API Gateway for every widget
  # ---------------------------------------------------------------------------
  AppApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # ---------------------------------------------------------------------------
  # Text Lambdas (buffered, one API path each)
  # ---------------------------------------------------------------------------
  EstimatedStudyTimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/estimated_study_time/
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /estimated-study-time
            Method: post

  BulletPointSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/bullet_point_summary/
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /bullet-point-summary
            Method: post

  KeyTermsGlossaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/key_terms_glossary/
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /key-terms-glossary
            Method: post

  RealWorldExamplesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/real_world_examples/
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /real-world-examples
            Method: post

  DifficultyLevelTagFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/difficulty_level_tag/
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /difficulty-level-tag
            Method: post

  FlashcardsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/flashcards/
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /flashcards
            Method: post

  InteractiveQuizFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/interactive_quiz/
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /interactive-quiz
            Method: post

  # ---------------------------------------------------------------------------
  # Image Lambda (Nova Canvas)
  # ---------------------------------------------------------------------------
  TopicVisualFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/topic_visual/
      Role: !GetAtt AppBedrockRole.Arn
      Timeout: 30
      MemorySize: 512
      Events:
        Post:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /topic-visual
            Method: post

  # ---------------------------------------------------------------------------
  # S3 static website hosting
  # ---------------------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

Outputs:
  ApiBaseUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  DiagramApiUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/topic-visual
  EstimatedStudyTimeUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/estimated-study-time
  BulletPointSummaryUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/bullet-point-summary
  KeyTermsGlossaryUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/key-terms-glossary
  RealWorldExamplesUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/real-world-examples
  DifficultyLevelTagUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/difficulty-level-tag
  FlashcardsUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/flashcards
  InteractiveQuizUrl:
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/interactive-quiz
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
  BucketName:
    Value: !Ref FrontendBucket
